---
layout: default
title: Blog
permalink: /blog/
---

<h1>Blog Posts</h1>

<div class="card-list">
  {% for post in site.posts %}
  <div class="card">
    <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
    <p>{{ post.excerpt | default: post.content | strip_html | truncate: 160 }}</p>
  </div>
  {% endfor %}
</div>
